name: Qualify candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full commit SHA to test; empty uses the selected workflow revision
        required: false
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Resolve frozen candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate and resolve the candidate once
        id: resolve
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const requested = process.env.REQUESTED_CANDIDATE || process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(requested)) {
            throw new Error("Candidate must be a full lowercase commit SHA.");
          }
          const commit = execFileSync("git", ["rev-parse", "--verify", `${requested}^{commit}`], {
            encoding: "utf8",
          }).trim();
          if (commit !== requested) throw new Error("Candidate did not resolve exactly.");
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          JS

  qualify:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2022
            platform: win32
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      TINTA_EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
      TINTA_EXPECTED_PLATFORM: ${{ matrix.platform }}
      TINTA_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Preserve exact source bytes on every platform
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: python
        with:
          python-version: 3.13.7
      - name: Install the pinned package manager and dependencies
        run: |
          npm install --global pnpm@10.34.6
          pnpm install --frozen-lockfile
      - name: Record and validate the native environment
        env:
          TINTA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm qualify:environment prepare
      - name: Install all pinned browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run automated qualification and supplementary measurements
        env:
          TINTA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm qualify --automated-only --performance supplementary
      - name: Summarize automated results and outstanding acceptance
        if: always()
        run: node scripts/qualification-ci.mjs summarize
      - name: Preserve reports and draft candidate artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qualification-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.candidate.outputs.commit }}-${{ github.run_attempt }}
          path: |
            reports/verification/
            build/qualification/
            build/performance/corpus.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
