name: Verify language
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      compiled_id: ${{ steps.compiled.outputs.artifact-id }}
      studio: ${{ steps.affected.outputs.studio }}
      vscode: ${{ steps.affected.outputs.vscode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Select affected components
        id: affected
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/release-plan.mjs --affected "$BEFORE" "$SOURCE" --pending
          else
            node scripts/release-plan.mjs --affected "$BEFORE" "$SOURCE"
          fi
      - name: Shared source checks
        if: steps.affected.outputs.language != 'true'
        run: |-
          python3 scripts/check_spec.py
          python3 -m unittest discover -s scripts/tests -v
          pnpm format:check
          pnpm lint
          pnpm check:dependencies
          pnpm check:architecture
          pnpm check:licenses
          pnpm exec vitest run tests/unit/release-plan.test.mjs tests/unit/release-contract.test.mjs tests/unit/release-candidate.test.mjs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: steps.affected.outputs.studio == 'true' || steps.affected.outputs.vscode == 'true'
      - run: pnpm verify --suite editing
        if: steps.affected.outputs.language == 'true'
      - name: Build and test Studio and CLI
        if: steps.affected.outputs.language != 'true' && steps.affected.outputs.studio == 'true'
        run: |-
          pnpm build:studio
          pnpm exec vitest run --config scripts/studio-vitest.config.js --coverage
          pnpm exec playwright test studio scheduling incident-diagnostics
          node scripts/studio-coverage.mjs
      - name: Build and test the extension
        if: steps.affected.outputs.language != 'true' && steps.affected.outputs.vscode == 'true'
        run: |-
          pnpm build:vscode
          pnpm test:vscode:unit
      - run: pnpm test:vscode:browser
        if: steps.affected.outputs.vscode == 'true'
      - name: Transfer the compilation for native CLI tests
        run: |
          mkdir -p build/transfer
          tar -czf build/transfer/compiled.tgz --exclude=build/transfer build packages/*/dist packages/cli/assets/tinta-studio.html
        if: steps.affected.outputs.studio == 'true'
      - name: Package the extension for native checks
        if: steps.affected.outputs.vscode == 'true'
        run: |-
          node scripts/package-vscode.mjs
          mkdir -p build/transfer
          cp build/vscode/tinta-0.1.0-dev.0.vsix build/transfer/tinta.vsix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: compiled
        with:
          name: compiled-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/transfer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
        if: steps.affected.outputs.studio == 'true' || steps.affected.outputs.vscode == 'true'
  vscode-performance:
    needs: verify
    if: needs.verify.outputs.vscode == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - shell: bash
        run: echo "TINTA_GLOBAL_MODULES=$(npm root --global)" >> "$GITHUB_ENV"
      - run: node scripts/candidate-tools.mjs --desktop
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.verify.outputs.compiled_id }}
          path: build/transfer
          merge-multiple: true
      - name: Measure installed extension performance
        shell: pwsh
        run: >-
          node scripts/test-vscode-installed.mjs
          "$env:TINTA_VSCODE_EXECUTABLE" "$env:TINTA_VSCODE_CLI"
          build/transfer/tinta.vsix "$env:RUNNER_TEMP/tinta-performance"
          --performance
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: vscode-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tinta-performance/result.json
          if-no-files-found: error
          retention-days: 7
  cli-portability:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022
    steps:
      - name: Report component selection
        if: needs.verify.outputs.studio != 'true'
        run: 'echo "CLI portability: not applicable; Studio/CLI inputs are unchanged." >> "$GITHUB_STEP_SUMMARY"'
        shell: bash
      - run: git config --global core.autocrlf false
        if: needs.verify.outputs.studio == 'true'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
        if: needs.verify.outputs.studio == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
        if: needs.verify.outputs.studio == 'true'
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
        if: needs.verify.outputs.studio == 'true'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: needs.verify.outputs.studio == 'true'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.verify.outputs.compiled_id }}
          path: build/transfer
          merge-multiple: true
        if: needs.verify.outputs.studio == 'true'
      - run: tar -xzf build/transfer/compiled.tgz
        if: needs.verify.outputs.studio == 'true'
      - run: pnpm exec vitest run tests/unit/cli.test.mjs tests/unit/cli-failures.test.mjs
        if: needs.verify.outputs.studio == 'true'
