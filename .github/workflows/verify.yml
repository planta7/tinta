name: Verify language
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      compiled_id: ${{ steps.compiled.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm verify --suite editing
      - run: pnpm test:vscode:browser
      - name: Transfer the compilation for native CLI tests
        run: |
          mkdir -p build/transfer
          tar -czf build/transfer/compiled.tgz --exclude=build/transfer build packages/*/dist apps/vscode/dist packages/cli/assets/tinta-studio.html
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        id: compiled
        with:
          name: compiled-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/transfer/compiled.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  cli-portability:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.verify.outputs.compiled_id }}
          path: build/transfer
          merge-multiple: true
      - run: tar -xzf build/transfer/compiled.tgz
      - run: pnpm exec vitest run tests/unit/cli.test.mjs tests/unit/cli-failures.test.mjs
