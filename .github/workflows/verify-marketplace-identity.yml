name: Verify Marketplace identity
on:
  workflow_dispatch:
permissions: {}
jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Isolate Azure CLI credentials
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/tinta-azure" >> "$GITHUB_ENV"
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: b9f5a8d5-3a91-42b5-a732-b44101964561
          tenant-id: 965b4876-de8a-43b7-b14d-6561c23374b3
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange
      - name: Verify publisher access without publishing
        run: pnpm exec vsce verify-pat planta7 --azure-credential
