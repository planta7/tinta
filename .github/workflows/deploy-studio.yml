name: Deploy Studio demo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: Published stable tinta release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: studio-pages
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TINTA_STUDIO_RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and extract the published Studio archive
        id: release
        run: node scripts/deploy-studio.mjs prepare
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.publish == 'true'
        with:
          path: build/demo-release/studio/
          retention-days: 7

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recheck the published release is current
        id: release
        run: node scripts/deploy-studio.mjs current
      - name: Deploy to GitHub Pages
        if: steps.release.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
