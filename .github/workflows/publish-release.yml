name: Publish release
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful candidate run ID
        required: true
        type: string
      candidate_attempt:
        description: Successful candidate attempt
        required: true
        type: string
      manifest_sha256:
        description: Reviewed manifest SHA-256
        required: true
        type: string
permissions: {}
concurrency:
  group: publication
  cancel-in-progress: false
env:
  TINTA_CANDIDATE_RUN: ${{ inputs.candidate_run }}
  TINTA_CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
  TINTA_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  TINTA_REVIEWED_PUBLISHER_SHA: ${{ vars.TINTA_REVIEWED_PUBLISHER_SHA }}
  TINTA_RELEASE_INTENT: ${{ vars.TINTA_RELEASE_INTENT }}
  TINTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
jobs:
  candidate-gate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      runtime_id: ${{ steps.runtime.outputs.artifact-id }}
      dependencies_sha256: ${{ steps.prepare.outputs.dependencies_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: prepare
        run: node scripts/publish-release.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - id: runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publisher-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/publication/candidate/
            build/publication/expected.json
            build/publication/npm.tgz
            build/publication/dependencies.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    needs: candidate-gate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.candidate-gate.outputs.runtime_id }}
          path: build/publication
          merge-multiple: true
      - name: Verify and restore reviewed tools without installation hooks
        env:
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import assert from "node:assert/strict";
          const bytes = readFileSync("build/publication/dependencies.tgz");
          const digest = createHash("sha256").update(bytes).digest("hex");
          assert.equal(digest, process.env.TINTA_DEPENDENCIES_SHA256);
          JS
          tar -xzf build/publication/dependencies.tgz
      - name: Submit and verify npm dependency closure
        run: node scripts/publish-release.mjs npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
      - name: Submit and verify prebuilt Marketplace archive
        run: node scripts/publish-release.mjs marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
      - name: Promote reviewed npm channels
        run: node scripts/publish-release.mjs promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
      - name: Publish complete GitHub Release
        run: node scripts/publish-release.mjs github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
      - name: Preserve local receipt in addition to durable journal
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/publication/receipt.json
          if-no-files-found: warn
          retention-days: 30
