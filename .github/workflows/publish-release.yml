name: Publish release
on:
  workflow_run:
    workflows:
      - Verify language
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: publication
  cancel-in-progress: false
  queue: max
env:
  TINTA_CANDIDATE_RUN: ${{ github.event.workflow_run.id }}
  TINTA_CANDIDATE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  TINTA_RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  TINTA_DEFAULT_BRANCH: main
jobs:
  candidate-gate:
    if:
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      runtime_id: ${{ steps.runtime.outputs.artifact-id }}
      dependencies_sha256: ${{ steps.prepare.outputs.dependencies_sha256 }}
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: prepare
        run: node scripts/publish-release.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - id: runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publisher-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/publication/candidate/
            build/publication/expected.json
            build/publication/npm.tgz
            build/publication/dependencies.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    needs: candidate-gate
    if:
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.candidate-gate.outputs.runtime_id }}
          path: build/publication
          merge-multiple: true
      - name: Verify and restore reviewed tools without installation hooks
        env:
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import assert from "node:assert/strict";
          const bytes = readFileSync("build/publication/dependencies.tgz");
          const digest = createHash("sha256").update(bytes).digest("hex");
          assert.equal(digest, process.env.TINTA_DEPENDENCIES_SHA256);
          JS
          tar -xzf build/publication/dependencies.tgz
      - name: Publish and verify the complete release
        run: node scripts/publish-release.mjs all
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TINTA_DEPENDENCIES_SHA256: ${{ needs.candidate-gate.outputs.dependencies_sha256 }}
      - name: Locate the published Studio release
        id: release
        run: node scripts/deploy-studio.mjs locate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve local receipt in addition to durable journal
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/publication/receipt.json
          if-no-files-found: warn
          retention-days: 30
    env:
      TINTA_MANIFEST_SHA256: ${{ needs.candidate-gate.outputs.manifest_sha256 }}
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
  prepare-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and extract the published Studio archive
        id: release
        run: node scripts/deploy-studio.mjs prepare
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.release.outputs.publish == 'true'
        with:
          path: build/demo-release/studio/
          retention-days: 7
    needs: publish
    env:
      GH_TOKEN: ${{ github.token }}
      TINTA_STUDIO_RELEASE_ID: ${{ needs.publish.outputs.release_id }}
  deploy-studio:
    needs:
      - publish
      - prepare-studio
    if: needs.prepare-studio.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recheck the published release is current
        id: release
        run: node scripts/deploy-studio.mjs current
      - name: Deploy to GitHub Pages
        if: steps.release.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
    env:
      GH_TOKEN: ${{ github.token }}
      TINTA_STUDIO_RELEASE_ID: ${{ needs.publish.outputs.release_id }}
