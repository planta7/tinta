name: Publish release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('Pages redeploy: {0}', inputs.studio_tag) ||
      format('Automatic release: {0}', github.event.workflow_run.head_sha) }}
on:
  workflow_dispatch:
    inputs:
      studio_tag:
        description: Latest completed Studio release tag to redeploy
        required: true
        type: string
  workflow_run:
    workflows:
      - Verify language
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: publication
  cancel-in-progress: false
  queue: max
env:
  TINTA_RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      payload_id: ${{ steps.payload.outputs.artifact-id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      hosts: ${{ steps.plan.outputs.hosts }}
      host_publish: ${{ steps.plan.outputs.host_publish }}
      language: ${{ steps.plan.outputs.language }}
      studio: ${{ steps.plan.outputs.studio }}
      studio_tag: ${{ steps.plan.outputs.studio_tag }}
      vscode: ${{ steps.plan.outputs.vscode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: echo "TINTA_GLOBAL_MODULES=$(npm root --global)" >> "$GITHUB_ENV"
      - run: node scripts/candidate-tools.mjs
      - name: Calculate versions and release notes
        id: plan
        run: node scripts/release-plan.mjs
      - name: Build selected components once
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |-
          mkdir -p build/payloads
          for component in $(jq -r ' .matrix.component[]' reports/release/plan.json); do
            export TINTA_COMPONENT="$component"
            pnpm "build:$component"
            node scripts/candidate-ci.mjs build
            mv build/distribution "build/payloads/$component"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.plan.outputs.publish == 'true'
        id: payload
        with:
          name: payloads-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            build/payloads/
            reports/release/plan.json
            reports/release/notes-*.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  installed:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ${{ matrix.native.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.build.outputs.matrix).component }}
        native:
          - cell: darwin-arm64
            os: macos-15
          - cell: linux-arm64
            os: ubuntu-24.04-arm
          - cell: win32-x64
            os: windows-2022
    env:
      TINTA_MATRIX_CELL: ${{ matrix.native.cell }}
      TINTA_PAYLOAD_ID: ${{ needs.build.outputs.payload_id }}
      TINTA_COMPONENT: ${{ matrix.component }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - shell: bash
        run: echo "TINTA_GLOBAL_MODULES=$(npm root --global)" >> "$GITHUB_ENV"
      - if: matrix.component != 'vscode'
        run: node scripts/candidate-tools.mjs
      - run: node scripts/candidate-tools.mjs --desktop
        if: matrix.component == 'vscode'
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: matrix.component != 'vscode'
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.component == 'vscode'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.payload_id }}
          path: build/input
          merge-multiple: true
      - name: Restore the versioned archives and plan
        shell: bash
        run: |-
          mkdir -p build/supplied reports/release
          cp -R "build/input/build/payloads/$TINTA_COMPONENT/." build/supplied/
          cp build/input/reports/release/* reports/release/
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/candidate-ci.mjs matrix
      - if: runner.os != 'Linux'
        run: node scripts/candidate-ci.mjs matrix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: results-${{ matrix.component }}-${{ matrix.native.cell }}-${{ needs.build.outputs.payload_id }}
          path: reports/candidate/
          if-no-files-found: error
          retention-days: 30
  release-language:
    needs:
      - build
      - installed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions: &release_permissions
      contents: write
      id-token: write
      attestations: write
    if: always() && needs.build.result == 'success' && needs.build.outputs.language == 'true'
    env:
      TINTA_COMPONENT: language
      TINTA_PAYLOAD_ID: ${{ needs.build.outputs.payload_id }}
    steps: &publish_steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 pnpm@10.34.6 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.payload_id }}
          path: build/input
          merge-multiple: true
      - name: Restore the archives and plan
        run: |-
          mkdir -p build/supplied reports/release
          cp -R "build/input/build/payloads/$TINTA_COMPONENT/." build/supplied/
          cp build/input/reports/release/* reports/release/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: results-${{ env.TINTA_COMPONENT }}-*-${{ needs.build.outputs.payload_id }}
          path: build/results
      - run: node scripts/candidate-ci.mjs assemble
      - uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4
        with:
          subject-path: |-
            build/supplied/*.tgz
            build/supplied/*.vsix
            build/supplied/*.zip
            build/supplied/*.json
            build/supplied/*.sha256
          create-storage-record: false
      - name: Create the immutable source tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG=$(jq -er --arg component "$TINTA_COMPONENT" '.components[$component].tag' reports/release/plan.json)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > build/tag.json; then
            test "$(jq -r '.object.type' build/tag.json)" = commit
            test "$(jq -r '.object.sha' build/tag.json)" = "$TINTA_RELEASE_SOURCE_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TINTA_RELEASE_SOURCE_SHA"
          fi
          gh release create "$RELEASE_TAG" $(find build/supplied -maxdepth 1 -type f | sort) --verify-tag --target "$TINTA_RELEASE_SOURCE_SHA" --draft --notes-file "reports/release/notes-$TINTA_COMPONENT.md"
      - name: Publish the tested npm targets
        if: env.TINTA_COMPONENT != 'vscode'
        run: |-
          cd build/supplied
          for archive in $(jq -r '.targets[] | select(.archive | endswith(".tgz")) | .archive' inventory.json); do
            jq -r --arg archive "$archive" '.targets[] | select(.archive == $archive) | .sha256 + "  " + .archive' inventory.json | sha256sum -c -
            npm publish "$archive" --access public --tag latest --ignore-scripts
          done
      - name: Isolate Azure CLI credentials
        if: env.TINTA_COMPONENT == 'vscode'
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/tinta-azure" >> "$GITHUB_ENV"
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: b9f5a8d5-3a91-42b5-a732-b44101964561
          tenant-id: 965b4876-de8a-43b7-b14d-6561c23374b3
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange
        if: env.TINTA_COMPONENT == 'vscode'
      - name: Publish the tested VSIX
        if: env.TINTA_COMPONENT == 'vscode'
        run: |
          archive=$(jq -er '.targets[] | select(.id == "vscode") | .archive' build/supplied/inventory.json)
          (cd build/supplied && jq -r '.targets[] | select(.id == "vscode") | .sha256 + "  " + .archive' inventory.json | sha256sum -c -)
          pnpm exec vsce publish --packagePath "build/supplied/$archive" --azure-credential
      - name: Complete this component release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
  release:
    needs:
      - build
      - installed
      - release-language
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions: *release_permissions
    if: >-
      always() && needs.build.result == 'success' &&
      needs.build.outputs.host_publish == 'true' &&
      (needs.release-language.result == 'success' ||
      needs.release-language.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.hosts) }}
    env:
      TINTA_COMPONENT: ${{ matrix.component }}
      TINTA_PAYLOAD_ID: ${{ needs.build.outputs.payload_id }}
    steps: *publish_steps
  deploy-studio:
    needs:
      - build
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.studio_tag || needs.build.outputs.studio_tag }}
    steps:
      - name: Check the completed release is current
        id: current
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^tinta-studio-v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          mkdir -p build/demo-release
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > build/tag.json
          source_sha=$(jq -er 'select(.object.type == "commit") | .object.sha' build/tag.json)
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          test -z "$TINTA_RELEASE_SOURCE_SHA" || test "$source_sha" = "$TINTA_RELEASE_SOURCE_SHA"
          echo "STUDIO_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,targetCommitish > build/release.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$source_sha" '
            .tagName == $tag and .isDraft == false and
            .isPrerelease == false and .targetCommitish == $sha
          ' build/release.json
          current=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -r '
            flatten | map(select(.draft == false and .prerelease == false)) |
            map(select(.tag_name | test("^tinta-studio-v[0-9]+[.][0-9]+[.][0-9]+$"))) |
            max_by(.tag_name | capture("^tinta-studio-v(?<version>[0-9.]+)$").version | split(".") | map(tonumber)) |
            .tag_name
          ')
          echo "publish=$([ "$current" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Download and verify the published Studio archive
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --pattern inventory.json --dir build/demo-release
          gh attestation verify build/demo-release/inventory.json \
            --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish-release.yml" \
            --source-digest "$STUDIO_SOURCE_SHA" \
            --signer-digest "$STUDIO_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          jq -e --arg sha "$STUDIO_SOURCE_SHA" \
            --arg version "${RELEASE_TAG#tinta-studio-v}" '
              .component == "studio" and .source.dirty == false and
              .source.commit == $sha and
              (.versions.studio // .versions.implementation) == $version
            ' build/demo-release/inventory.json
          archive=$(jq -er '
            [.targets[] | select(.id == "studio-directory")] |
            select(length == 1) | .[0].archive
          ' build/demo-release/inventory.json)
          test "$archive" = "studio-directory-${RELEASE_TAG#tinta-studio-v}.zip"
          gh release download "$RELEASE_TAG" --pattern "$archive" --dir build/demo-release
          (cd build/demo-release && jq -r '.targets[] | select(.id == "studio-directory") | .sha256 + "  " + .archive' inventory.json | sha256sum -c -)
          mkdir -p build/demo-release/studio
          unzip -q "build/demo-release/$archive" -d build/demo-release/studio
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.current.outputs.publish == 'true'
        with:
          path: build/demo-release/studio/
      - name: Recheck the release before deployment
        if: steps.current.outputs.publish == 'true'
        id: recheck
        shell: bash
        run: |
          current=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -r '
            flatten | map(select(.draft == false and .prerelease == false)) |
            map(select(.tag_name | test("^tinta-studio-v[0-9]+[.][0-9]+[.][0-9]+$"))) |
            max_by(.tag_name | capture("^tinta-studio-v(?<version>[0-9.]+)$").version | split(".") | map(tonumber)) |
            .tag_name
          ')
          echo "publish=$([ "$current" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        if: steps.recheck.outputs.publish == 'true'
        id: deployment
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (needs.build.result == 'success' && needs.build.outputs.studio == 'true')
      )
