<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="180"
  viewBox="0 0 1280 180"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">tinta</title>
  <desc id="description">
    The blue italic t monogram and lowercase tinta wordmark. A document. With
