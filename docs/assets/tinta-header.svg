  </desc>
  <rect width="1280" height="180" rx="16" fill="#f4f4f6" />
  <rect x="40" y="38" width="88" height="104" rx="12" fill="#e8edf8" />
  <text
    x="70"
    y="120"
    fill="#384e99"
